<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>T-Corpus — TIMAV Digital Humanities Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<script>
  // Tarayıcı diline göre yönlendir; varsayılan Türkçe.
  var l = (navigator.language || "tr").toLowerCase();
  var hedef = "tr/";
  if (l.indexOf("ar") === 0) hedef = "ar/";
  else if (l.indexOf("tr") !== 0) hedef = "en/";
  location.replace(hedef);
</script>
<meta http-equiv="refresh" content="0; url=tr/">
</head>
<body>
<p><a href="tr/">Türkçe</a> · <a href="en/">English</a> · <a href="ar/">العربية</a></p>
</body>
</html>
